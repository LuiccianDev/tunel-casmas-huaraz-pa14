# =============================================================================
#  02 · GEOLOGÍA — pendiente: el usuario entregará los datos estructurados.
#  Mientras tanto, los parámetros dependientes de la roca están marcados (S)
#  en [seccion] y [perforacion].
# =============================================================================

# =============================================================================
#  03 · SECCIÓN, PERFORACIÓN Y AVANCE
# =============================================================================
[seccion]
tipo = "Herradura: hastiales rectos + bóveda semicircular (R = B/2)"
ancho_m = 13.30                # B, ancho total de excavación (plano CAD del proyecto)
altura_m = 9.58                # H, fondo de excavación → clave (plano CAD)
altura_sobre_rasante_m = 9.08  # rasante → clave (plano CAD); H − esto = espesor bajo rasante
sobreexcavacion = 0.10      # (S) 10 % sobre el volumen teórico
factor_esponjamiento = 1.50 # (S) roca → ajustar con geología
densidad_roca_t_m3 = 2.60   # (S) ajustar con geología

# Gálibo y plataforma (rectángulo de gálibo del plano CAD, medidas en m)
[seccion.galibo]
carriles = 2           # und, vía de dos carriles (plano CAD)
ancho_carril_m = 3.60  # plano CAD
berma_m = 1.80         # cada lado (plano CAD)
separador_m = 1.00     # separador central en el eje (plano CAD)
vereda_m = 0.75        # cada lado, entre gálibo y hastial (plano CAD)
altura_m = 5.50        # altura del rectángulo de gálibo sobre la rasante (plano CAD)
cuneta_ancho_m = 1.20  # cuneta lateral (plano CAD)
cuneta_prof_m = 0.40   # cuneta lateral (plano CAD)
bombeo_pct = 2.0       # bombeo transversal (plano CAD)
tolerancia_m = 0.01    # redondeo de las cotas del plano CAD (comprobaciones geométricas)

# Mínimos normativos (Perú). Ver docs/memoria/03_Seccion.md
[seccion.norma]
# MTC, Manual de Carreteras: Túneles, Muros y Obras Complementarias (RD 036-2016-MTC/14)
galibo_vertical_m = 5.50    # gálibo vertical mínimo sobre la plataforma
vereda_m = 0.75             # vereda mínima a cada lado (mantenimiento / auxilio)
altura_vereda_m = 2.40      # (S) altura libre mínima sobre vereda → verificar en el manual
longitud_emergencia_m = 500 # (S) túnel > 500 m: prever zonas de emergencia → verificar
# MTC, Manual de Carreteras: Diseño Geométrico DG-2018, Sección 304
ancho_carril_m = 3.60       # carril para carretera de 1.ª clase / autopista
berma_m = 1.20              # (S) berma mínima de referencia → verificar Tabla 304.02

[perforacion]
frentes = 2                     # frentes de ataque (1 = un solo portal)
disparos_por_dia_frente = 2     # (S) 1 por guardia
dias_trabajo_mes = 30           # trabajo continuo
longitud_barreno_m = 3.66       # (S) barra de 12 pies
eficiencia_avance = 0.90        # (S)
espaciamiento_periferico_m = 0.60 # (S) E, fórmula N = P/E + K·A
coeficiente_roca_k = 1.5        # (S) K: 2.0 dura · 1.5 intermedia · 1.0 suave
factor_carga_kg_m3 = 1.60       # (S) kg explosivo / m³ roca

