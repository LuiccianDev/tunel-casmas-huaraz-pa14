# =============================================================================
#  05 · CAMPAMENTO (38 EDIFICACIONES ESPECIALIZADAS - EDIF-01 A EDIF-38)
#  Normativas: RNE (G.050, A.010, A.060, A.070, A.080, IS.010, EM.010),
#              D.S. 024-2016-EM / D.S. 023-2017-EM (Seguridad Minera a 3,850 msnm),
#              MTC EG-2013 (Sección 104 - Campamentos y Patios de Maquinaria),
#              Ley N° 30299 (SUCAMEC - Polvorines Principales y Satélites)
# =============================================================================
[campamento]
ancho_edificio_m = 6.0
factor_terreno = 1.5 # Relación área total terreno / área edificada (vías, retiros, accesos)

# Parámetros arquitectónicos de detalle para EDIF-01 (Modular Dormitorio - Plano AR-DM-001)
[campamento.edif01_detalle]
largo_total_m = 48.70           # m, largo total del pabellón modular (plano AR-DM-001)
ancho_cuerpo_m = 12.00          # m, ancho de crujía habitable (5m + 2m + 5m)
ancho_total_m = 18.00           # m, ancho total incluyendo voladizos y escaleras exteriores
ancho_modulo_m = 3.50           # m, ancho modular de habitación según RNE A.020 (área útil >= 14 m²)
profundidad_habitacion_m = 5.00  # m, profundidad según modulación prefabricada y RNE A.020
ancho_pasadizo_m = 2.00         # m, ancho pasadizo central térmico (RNE A.070 / A.130)
ancho_modulo_central_m = 4.50   # m, ancho vestíbulo central y caja de escaleras según RNE A.130 Art. 22
espesor_muro_ext_m = 0.15       # m, panel sándwich termoacústico PIR 100mm + perfiles según RNE EM.050
espesor_tabique_m = 0.10        # m, tabiquería modular drywall acústico con lana de roca RNE EM.050
altura_planta_baja_m = 2.50     # m, altura libre nivel PB (plano AR-DM-001)
altura_primer_piso_m = 2.60     # m, altura libre nivel P1 (plano AR-DM-001)
altura_techo_cercha_m = 1.50    # m, flecha para pendiente 25% drenaje pluvial en sierra RNE OS.060
ancho_cama_m = 1.00             # m, cama individual plaza y media estándar hotelero/staff
largo_cama_m = 2.00             # m, largo estándar ergonómico NTP 260.001
ancho_bano_m = 1.50             # m, ancho baño privado completo según RNE IS.010
largo_bano_m = 1.80             # m, largo baño con inodoro, lavatorio y ducha según RNE IS.010
ancho_closet_m = 0.60           # m, profundidad estándar de ropero según RNE A.020
largo_closet_m = 1.20           # m, frente mínimo para guardarropa de faena NTP 260.001
codigo_plano = "AR-DM-001"      # código de plano según catálogo de edificaciones
revision_plano = "REV B"        # revisión del entregable
escala_plano = "1:100"          # escala normalizada de presentación

