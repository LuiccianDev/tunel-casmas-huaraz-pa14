# =============================================================================
#  PARÁMETROS DEL PROYECTO — TÚNEL CASMAS HUARAZ PA14
# -----------------------------------------------------------------------------
#  Única fuente de datos de entrada. Ningún número de diseño va "a mano" en el
#  código Python: se cambia aquí y se vuelve a ejecutar `uv run pa14`.
#
#  (S) = SUPUESTO / valor típico. Debe verificarse o reemplazarse con datos
#        reales del proyecto, del docente o de la norma indicada.
#  Unidades SI (m, m², m³, kg, t, kW, L, días) salvo que el nombre diga otra.
# =============================================================================

[proyecto]
nombre = "Túnel Casmas Huaraz PA14"
curso = "Túneles"
fecha_inicio = 2026-11-02 # Hito contractual de entrega de terreno y acta de inicio de obra
altitud_msnm = 3850.0     # Altitud media real entre entrada (3900) y salida (3800)

# =============================================================================
#  01 · UBICACIÓN — coordenadas UTM oficiales del proyecto
# =============================================================================
[ubicacion]
datum = "WGS84"
zona_utm = "18 L"
portal_entrada = "PE" # id del punto que es portal de entrada
portal_salida = "PS"  # id del punto que es portal de salida

[[ubicacion.puntos]]
id = "BOT1"
nombre = "BOTADERO 1"
zona = "18 L"
este = 214687.13
norte = 8942926.18
cota = 3860.0

[[ubicacion.puntos]]
id = "BOT2"
nombre = "BOTADERO 2"
zona = "18 L"
este = 208582.25
norte = 8942242.82
cota = 3810.0

[[ubicacion.puntos]]
id = "CAM2"
nombre = "CAMPAMENTO 2"
zona = "18 L"
este = 208309.54
norte = 8942152.25
cota = 3810.0

[[ubicacion.puntos]]
id = "CAM1"
nombre = "CAMPAMENTO PRINCIPAL"
zona = "18 L"
este = 216495.92
norte = 8942234.47
cota = 3930.0

[[ubicacion.puntos]]
id = "POZ"
nombre = "POZO DE AGUA PROFUNDO"
zona = "18 L"
este = 216450.00
norte = 8942200.00
cota = 3925.0

[[ubicacion.puntos]]
id = "PE"
nombre = "ENTRADA TUNEL"
zona = "18 L"
este = 214435.96
norte = 8942843.19
cota = 3900.0

[[ubicacion.puntos]]
id = "PS"
nombre = "SALIDA DEL TUNEL"
zona = "18 L"
este = 209031.05
norte = 8942758.864
cota = 3785.0

# Distancias calculadas entre componentes del proyecto
# Retiros de seguridad y distancias ambientales normativas (MTC EG-2013 / DS 024-2016-EM / DL 1278)
[[ubicacion.restricciones]]
desde = "PE"
hasta = "BOT1"
minimo_m = 100.0
fuente = "MTC EG-2013 Sec. 210 / DS 024-2016-EM (Retiro ambiental portal Entrada a Botadero 1 >= 100 m)"

[[ubicacion.restricciones]]
desde = "PS"
hasta = "BOT2"
minimo_m = 100.0
fuente = "MTC EG-2013 Sec. 210 / DS 024-2016-EM (Retiro ambiental portal Salida a Botadero 2 >= 100 m)"

[[ubicacion.restricciones]]
desde = "PE"
hasta = "CAM1"
minimo_m = 100.0
fuente = "MTC EG-2013 Sec. 104 / DS 024-2016-EM (Retiro de seguridad portal Entrada a Campamento Principal >= 100 m)"

[[ubicacion.restricciones]]
desde = "PS"
hasta = "CAM2"
minimo_m = 100.0
fuente = "MTC EG-2013 Sec. 104 / DS 024-2016-EM (Retiro de seguridad portal Salida a Campamento 2 >= 100 m)"

[[ubicacion.restricciones]]
desde = "CAM2"
hasta = "BOT2"
minimo_m = 100.0
fuente = "MTC EG-2013 Sec. 104 / DL 1278 (Distancia sanitaria Campamento 2 a Botadero 2 >= 100 m)"

[[ubicacion.restricciones]]
desde = "CAM1"
hasta = "BOT1"
minimo_m = 100.0
fuente = "MTC EG-2013 Sec. 104 / DL 1278 (Distancia sanitaria Campamento Principal a Botadero 1 >= 100 m)"

# =============================================================================
#  02 · GEOLOGÍA — Integrado con el perfil geológico longitudinal real (5556 m)
#  Ver matriz de tramos en [[geologia.tramos]].
# =============================================================================

# =============================================================================
#  03 · SECCIÓN, PERFORACIÓN Y AVANCE
# =============================================================================
[seccion]
tipo = "Herradura: hastiales rectos + bóveda semicircular (R = B/2)"
ancho_m = 13.30                # B, ancho total de excavación (plano CAD del proyecto)
altura_m = 9.58                # H, fondo de excavación → clave (plano CAD)
altura_sobre_rasante_m = 9.08  # rasante → clave (plano CAD); H − esto = espesor bajo rasante
sobreexcavacion = 0.10      # Rango normativo 8-12 % para excavación mecánica/voladura en macizo RMR II-III (Manual MTC / USBR)
factor_esponjamiento = 1.35 # Factor medio ponderado según litología del perfil geológico (Po-har/Po-hua)
densidad_roca_t_m3 = 2.60   # Densidad media ponderada del perfil geológico (Andesitas 2.60 t/m³)

# Gálibo y plataforma (rectángulo de gálibo del plano CAD, medidas en m)
[seccion.galibo]
carriles = 2           # und, vía de dos carriles (plano CAD)
ancho_carril_m = 3.60  # plano CAD
berma_m = 1.80         # cada lado (plano CAD)
separador_m = 1.00     # separador central en el eje (plano CAD)
vereda_m = 0.75        # cada lado, entre gálibo y hastial (plano CAD)
altura_m = 5.50        # altura del rectángulo de gálibo sobre la rasante (plano CAD)
cuneta_ancho_m = 1.20  # cuneta lateral (plano CAD)
cuneta_prof_m = 0.40   # cuneta lateral (plano CAD)
bombeo_pct = 2.0       # bombeo transversal (plano CAD)
tolerancia_m = 0.01    # redondeo de las cotas del plano CAD (comprobaciones geométricas)

# Mínimos normativos (Perú). Ver docs/memoria/03_Seccion.md y docs/MARCO_REGULATORIO_Y_TECNICO.md
[seccion.norma]
# MTC, Manual de Carreteras: Túneles, Muros y Obras Complementarias (RD 036-2016-MTC/14)
galibo_vertical_m = 5.50    # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (Gálibo vertical libre sobre plataforma)
vereda_m = 0.75             # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (Ancho mínimo vereda de auxilio y mantenimiento)
altura_vereda_m = 2.40      # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (Altura libre mínima sobre vereda en hastial)
longitud_emergencia_m = 500 # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (Túneles L > 500 m exigen instalaciones de auxilio)
# MTC, Manual de Carreteras: Diseño Geométrico DG-2018, Sección 304
ancho_carril_m = 3.60       # Unidad: m | Norma: MTC DG-2018 Tabla 304.01 (Carretera 1ra Clase, Vd = 60 km/h)
berma_m = 1.20              # Unidad: m | Norma: MTC DG-2018 Tabla 304.02 (Mínimo absoluto en túnel orografía tipo 3/4)

[perforacion]
frentes = 2                     # frentes de ataque (1 = un solo portal)
disparos_por_dia_frente = 2     # Ciclo de 2 guardias x 12 h con ventilación y desate según D.S. 024-2016-EM Art. 272
dias_trabajo_mes = 30           # trabajo continuo
longitud_barreno_m = 3.66       # Barra estándar de 12 pies para Jumbo Sandvik DT820
eficiencia_avance = 0.90        # 90 % de avance efectivo por voladura en cuñe de cuatro secciones (Manual EXSA)
espaciamiento_periferico_m = 0.60 # E, recorte perimetral para control de daño según Manual EXSA (E = 15·D)
coeficiente_roca_k = 1.5        # Coeficiente de roca intermedia según fórmula empírica de Langefors-Kihlström
factor_carga_kg_m3 = 1.60       # Factor de carga específico para túneles sección herradura (Manual EXSA 5ta Ed.)

