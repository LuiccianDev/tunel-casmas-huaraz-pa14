[petar]
coef_retorno = 0.80             # 80 % del agua consumida se colecta como aguas residuales (RNE IS.020 Art. 4.1)
tasa_lodos_l_hab_anio = 70.0    # Tasa de acumulación de lodos en clima frío/templado (RNE IS.020 Tabla 1)
intervalo_limpieza_anios = 1.0  # Frecuencia de remoción y purga de lodos digeridos (RNE IS.020)
volumen_natas_m3 = 0.70         # Mínimo normativo para retención de grasas y flotantes (RNE IS.020 Art. 4.4)
