[normativa_mtc]
norma = "MTC RD 036-2016-MTC/14, DG-2018 y EG-2013"
clasificacion_tunel = "Clase I (Longitud > 3000 m)" # Unidad: texto | Norma: MTC RD 036-2016-MTC/14
tipo_carretera = "Primera Clase"                   # Unidad: texto | Norma: MTC DG-2018 Secc. 101 (IMDA 2001-4000 veh/día)
velocidad_diseno_km_h = 60.0                       # Unidad: km/h | Norma: MTC DG-2018 Tabla 204.01
ancho_carril_min_m = 3.60                          # Unidad: m | Norma: MTC DG-2018 Tabla 304.01
berma_min_m = 1.20                                 # Unidad: m | Norma: MTC DG-2018 Tabla 304.02 (mínimo absoluto túnel)
berma_diseno_m = 1.80                              # Unidad: m | Norma: Plano CAD (supera mínimo normativo de 1.20 m)
galibo_vertical_min_m = 5.50                       # Unidad: m | Norma: MTC RD 036-2016-MTC/14 y DG-2018 Sec. 304.08
vereda_min_m = 0.75                                # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (mantenimiento y evacuación)
vereda_altura_libre_min_m = 2.40                   # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (borde hastial)
borde_vereda_alto_m = 0.20                         # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (resguardo físico peatonal)
pendiente_longitudinal_max_pct = 3.0               # Unidad: % | Norma: MTC RD 036-2016-MTC/14 para L > 1000 m
pendiente_longitudinal_min_pct = 0.5               # Unidad: % | Norma: MTC RD 036-2016-MTC/14 (autolimpieza cunetas)
bombeo_transversal_pct = 2.0                       # Unidad: % | Norma: MTC RD 036-2016-MTC/14 (desagüe rápido plataforma)
distancia_visibilidad_parada_m = 87.10             # Unidad: m | Norma: MTC DG-2018 para Vd = 60 km/h y pendiente 1.81%
espaciamiento_apartaderos_m = 750.0                # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (cada 750-1000 m en Clase I)
apartadero_largo_util_m = 40.0                     # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (longitud útil parada)
apartadero_ancho_m = 3.00                          # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (ancho de parada adicional)
espaciamiento_nichos_sos_m = 150.0                 # Unidad: m | Norma: MTC RD 036-2016-MTC/14 para Clase I
espaciamiento_hidrantes_m = 150.0                  # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (red presurizada contra incendios)
espaciamiento_galerias_evacuacion_m = 400.0        # Unidad: m | Norma: MTC RD 036-2016-MTC/14 (galería escape cada 250-400 m)
potencia_fuego_diseno_mw = 30.0                    # Unidad: MW | Norma: MTC RD 036-2016-MTC/14 (incendio vehículo comercial)
velocidad_critica_aire_incendio_m_s = 2.50         # Unidad: m/s | Norma: MTC RD 036-2016-MTC/14 (prevención de backlayering)
shotcrete_fc_28d_kg_cm2 = 280.0                    # Unidad: kg/cm² | Norma: MTC EG-2013 (28 MPa vía húmeda)
shotcrete_efnarc_joules = 500.0                    # Unidad: Joules | Norma: MTC EG-2013 (absorción energía deflexión 25 mm)
pernos_pull_out_test_pct = 1.0                     # Unidad: % | Norma: MTC EG-2013 (ensayo de arrancamiento 1% pernos)

[normativa_sucamec]
norma = "Ley N° 30299 y D.S. N° 010-2017-IN"
polvorines_separados = true                        # Unidad: boolean | Norma: SUCAMEC D.S. 010-2017-IN (independencia física obligatoria)
distancia_seguridad_formula = "D = K * Q^(1/3)"    # Unidad: fórmula | Norma: Hopkinson / SUCAMEC D.S. 010-2017-IN
factor_k_campamento = 6.0                          # Unidad: adimensional | Norma: SUCAMEC (con parapeto a campamento)
factor_k_carretera = 4.0                           # Unidad: adimensional | Norma: SUCAMEC (con parapeto a vía pública)
