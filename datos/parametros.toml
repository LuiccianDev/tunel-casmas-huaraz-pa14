reserva_m3 = 10.0          # Reserva de emergencia y contra incendios en faena (RNE OS.030 / DS 024-2016-EM)
altura_tanque_m = 2.0      # Altura útil de reservorio apoyado
tasa_filtracion_m_h = 0.20 # Tasa de filtración lenta en arena 0.1–0.2 m/h (RNE OS.020)
dosis_cloro_mg_l = 1.5     # Cloro libre residual y desinfección preventiva (DS 031-2010-SA)
