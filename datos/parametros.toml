# =============================================================================
#  PARÁMETROS DEL PROYECTO — TÚNEL CASMAS HUARAZ PA14
# -----------------------------------------------------------------------------
#  Única fuente de datos de entrada. Ningún número de diseño va "a mano" en el
#  código Python: se cambia aquí y se vuelve a ejecutar `uv run pa14`.
#
#  (S) = SUPUESTO / valor típico. Debe verificarse o reemplazarse con datos
#        reales del proyecto, del docente o de la norma indicada.
#  Unidades SI (m, m², m³, kg, t, kW, L, días) salvo que el nombre diga otra.
# =============================================================================

[proyecto]
nombre = "Túnel Casmas Huaraz PA14"
curso = "Túneles"
fecha_inicio = 2026-11-02 # (S) inicio de obra
altitud_msnm = 3850.0     # Altitud media real entre entrada (3900) y salida (3800)

# =============================================================================
#  01 · UBICACIÓN — coordenadas UTM oficiales del proyecto
# =============================================================================
[ubicacion]
datum = "WGS84"
zona_utm = "18 L"
portal_entrada = "PE" # id del punto que es portal de entrada
portal_salida = "PS"  # id del punto que es portal de salida

[[ubicacion.puntos]]
id = "BOT1"
nombre = "BOTADERO 1"
zona = "18 L"
este = 214687.13
norte = 8942926.18
cota = 3860.0

[[ubicacion.puntos]]
id = "BOT2"
nombre = "BOTADERO 2"
zona = "18 L"
este = 208582.25
norte = 8942242.82
cota = 3810.0

[[ubicacion.puntos]]
id = "CAM2"
nombre = "CAMPAMENTO 2"
zona = "18 L"
este = 208309.54
norte = 8942152.25
cota = 3810.0

[[ubicacion.puntos]]
id = "CAM1"
nombre = "CAMPAMENTO PRINCIPAL"
zona = "18 L"
este = 216495.92
norte = 8942234.47
cota = 3930.0

[[ubicacion.puntos]]
id = "PE"
nombre = "ENTRADA TUNEL"
zona = "18 L"
este = 214435.96
norte = 8942843.19
cota = 3900.0

[[ubicacion.puntos]]
id = "PS"
nombre = "SALIDA DEL TUNEL"
zona = "18 L"
este = 208898.27
norte = 8942757.03
cota = 3800.0

# Distancias calculadas entre componentes del proyecto
[[ubicacion.restricciones]]
desde = "PE"
hasta = "BOT1"
minimo_m = 100.0
fuente = "Distancia portal Entrada a Botadero 1"

[[ubicacion.restricciones]]
desde = "PS"
hasta = "BOT2"
minimo_m = 100.0
fuente = "Distancia portal Salida a Botadero 2"

[[ubicacion.restricciones]]
desde = "PE"
hasta = "CAM1"
minimo_m = 100.0
fuente = "Distancia portal Entrada a Campamento Principal"

[[ubicacion.restricciones]]
desde = "PS"
hasta = "CAM2"
minimo_m = 100.0
fuente = "Distancia portal Salida a Campamento 2"

[[ubicacion.restricciones]]
desde = "CAM2"
hasta = "BOT2"
minimo_m = 100.0
fuente = "Distancia Campamento 2 a Botadero 2"

[[ubicacion.restricciones]]
desde = "CAM1"
hasta = "BOT1"
minimo_m = 100.0
fuente = "Distancia Campamento Principal a Botadero 1"

# =============================================================================
#  02 · GEOLOGÍA — pendiente: el usuario entregará los datos estructurados.
#  Mientras tanto, los parámetros dependientes de la roca están marcados (S)
#  en [seccion] y [perforacion].
# =============================================================================

# =============================================================================
#  03 · SECCIÓN, PERFORACIÓN Y AVANCE
# =============================================================================
[seccion]
tipo = "Herradura: hastiales rectos + bóveda semicircular (R = B/2)"
ancho_m = 13.30                # B, ancho total de excavación (plano CAD del proyecto)
altura_m = 9.58                # H, fondo de excavación → clave (plano CAD)
altura_sobre_rasante_m = 9.08  # rasante → clave (plano CAD); H − esto = espesor bajo rasante
sobreexcavacion = 0.10      # (S) 10 % sobre el volumen teórico
factor_esponjamiento = 1.50 # (S) roca → ajustar con geología
densidad_roca_t_m3 = 2.60   # (S) ajustar con geología

# Gálibo y plataforma (rectángulo de gálibo del plano CAD, medidas en m)
[seccion.galibo]
carriles = 2           # und, vía de dos carriles (plano CAD)
ancho_carril_m = 3.60  # plano CAD
berma_m = 1.80         # cada lado (plano CAD)
separador_m = 1.00     # separador central en el eje (plano CAD)
vereda_m = 0.75        # cada lado, entre gálibo y hastial (plano CAD)
altura_m = 5.50        # altura del rectángulo de gálibo sobre la rasante (plano CAD)
cuneta_ancho_m = 1.20  # cuneta lateral (plano CAD)
cuneta_prof_m = 0.40   # cuneta lateral (plano CAD)
bombeo_pct = 2.0       # bombeo transversal (plano CAD)
tolerancia_m = 0.01    # redondeo de las cotas del plano CAD (comprobaciones geométricas)

# Mínimos normativos (Perú). Ver docs/memoria/03_Seccion.md
[seccion.norma]
# MTC, Manual de Carreteras: Túneles, Muros y Obras Complementarias (RD 036-2016-MTC/14)
galibo_vertical_m = 5.50    # gálibo vertical mínimo sobre la plataforma
vereda_m = 0.75             # vereda mínima a cada lado (mantenimiento / auxilio)
altura_vereda_m = 2.40      # (S) altura libre mínima sobre vereda → verificar en el manual
longitud_emergencia_m = 500 # (S) túnel > 500 m: prever zonas de emergencia → verificar
# MTC, Manual de Carreteras: Diseño Geométrico DG-2018, Sección 304
ancho_carril_m = 3.60       # carril para carretera de 1.ª clase / autopista
berma_m = 1.20              # (S) berma mínima de referencia → verificar Tabla 304.02

[perforacion]
frentes = 2                     # frentes de ataque (1 = un solo portal)
disparos_por_dia_frente = 2     # (S) 1 por guardia
dias_trabajo_mes = 30           # trabajo continuo
longitud_barreno_m = 3.66       # (S) barra de 12 pies
eficiencia_avance = 0.90        # (S)
espaciamiento_periferico_m = 0.60 # (S) E, fórmula N = P/E + K·A
coeficiente_roca_k = 1.5        # (S) K: 2.0 dura · 1.5 intermedia · 1.0 suave
factor_carga_kg_m3 = 1.60       # (S) kg explosivo / m³ roca

# =============================================================================
#  04 · PERSONAL (Organización oficial: 346 pax en campamento, régimen 14x7)
#  Macro-Áreas: Campamento (155 pax) · Frente (110 pax) · Servicio (81 pax)
#  Campamentos: CAMP1 (Portal A: 248 pax) · CAMP2 (Portal B: 98 pax)
#  Guardias: Guardia Día (231 pax) · Guardia Noche (115 pax)
#  Mano de obra: Directa (110 pax) · Indirecta (236 pax)
# =============================================================================
[regimen]
dias_trabajo = 14 # D.S. 024-2016-EM Art. 201 (régimen atípico 14x7)
dias_descanso = 7

