nombre = "CAMPAMENTO PRINCIPAL"
zona = "18 L"
este = 216495.92
norte = 8942234.47
cota = 3930.0

[[ubicacion.puntos]]
id = "PE"
nombre = "ENTRADA TUNEL"
zona = "18 L"
este = 214435.96
norte = 8942843.19
cota = 3900.0

[[ubicacion.puntos]]
id = "PS"
