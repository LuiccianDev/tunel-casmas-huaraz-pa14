# =============================================================================
#  07 · POLVORÍN — SUCAMEC Ley N° 30299 y D.S. N° 010-2017-IN
# =============================================================================
[polvorin]
dias_stock = 15 # Unidad: días | Norma: SUCAMEC D.S. 010-2017-IN (Autonomía operativa estándar para frentes remotos)

[polvorin.explosivos]
unidades_por_caja = 25.0 # Unidad: kg/caja | Norma: FAMESA / EXSA estándar industrial de emulsiones encartuchadas
caja_largo_m = 0.50      # Unidad: m | Norma: Embalaje comercial normalizado
caja_ancho_m = 0.30      # Unidad: m | Norma: Embalaje comercial normalizado
caja_alto_m = 0.25       # Unidad: m | Norma: Embalaje comercial normalizado
altura_max_ruma_m = 1.50 # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN Art. 186 (Máximo 10 cajas superpuestas o 1.50 m)
filas = 2                # Unidad: filas | Norma: Distribución simétrica con pasillo central
pasillo_m = 1.20         # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN Art. 186 (Pasillo libre >= 1.20 m para explosivos)
separacion_rumas_m = 0.10 # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN (Separación entre rumas adyacentes)
separacion_pared_m = 0.30 # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN (Separación perimetral libre para ventilación)
altura_libre_m = 1.00    # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN (Distancia vertical mínima ruma superior a techo)
espesor_muro_m = 0.30    # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN (Muros de concreto/mampostería e >= 0.30 m)

[polvorin.accesorios]
detonadores_por_taladro = 1 # Unidad: und/taladro | Norma: 1 iniciador Fanel por barreno
unidades_por_caja = 200.0 # Unidad: detonadores/caja | Norma: Presentación comercial FAMESA Fanel / Nonel
caja_largo_m = 0.50       # Unidad: m | Norma: Embalaje comercial normalizado
caja_ancho_m = 0.35       # Unidad: m | Norma: Embalaje comercial normalizado
caja_alto_m = 0.30        # Unidad: m | Norma: Embalaje comercial normalizado
altura_max_ruma_m = 1.50  # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN Art. 186 (Máximo 1.50 m de apilamiento)
filas = 1                 # Unidad: filas | Norma: Distribución para polvorín de accesorios
pasillo_m = 1.00          # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN Art. 186 (Pasillo libre >= 1.00 m para accesorios)
separacion_rumas_m = 0.10 # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN (Separación entre rumas)
separacion_pared_m = 0.30 # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN (Separación libre a muros)
altura_libre_m = 1.00     # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN (Distancia vertical libre a techo)
espesor_muro_m = 0.30     # Unidad: m | Norma: SUCAMEC D.S. 010-2017-IN (Espesor de muros perimetrales)

