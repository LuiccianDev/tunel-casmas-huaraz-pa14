[project]
name = "casmas-pa14"
version = "0.1.0"
description = "Cálculos y planos del proyecto de túnel Casmas Huaraz PA14 (curso de Túneles)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LuiccianDev" }
]
license = { text = "MIT" }
keywords = ["túneles", "ingeniería", "autolisp", "excel", "pa14"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "openpyxl>=3.1",
]

[project.urls]
Repository = "https://github.com/LuiccianDev/tunel-casmas-huaraz-pa14-ejemplo"

[project.scripts]
pa14 = "casmas_pa14.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casmas_pa14"]

# ------------------------------------------------------------------ Ruff
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".agents",
    ".venv",
    "salidas",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C90", "RET"]
ignore = ["E501"] # textos de fórmulas largos; el formateador controla el código

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------------ Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

# ------------------------------------------------------------------ Mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
