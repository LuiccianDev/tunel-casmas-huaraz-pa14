[project]
name = "casmas-pa14"
version = "0.1.0"
description = "Cálculos y planos del proyecto de túnel Casmas Huaraz PA14 (curso de Túneles)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
pa14 = "casmas_pa14.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casmas_pa14"]

# ------------------------------------------------------------------ Ruff
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".agents",
    ".venv",
    "salidas",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"] # textos de fórmulas largos; el formateador controla el código

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------------ Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
